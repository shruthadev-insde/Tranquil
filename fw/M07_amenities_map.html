<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tranquil Bay · Life at Tranquil Bay</title>
<link rel="stylesheet" href="tb-core.css">
<style>
  .am{position:relative;height:var(--tb-vh,100vh);min-height:640px;background:var(--tb-ink);color:var(--tb-paper);overflow:hidden}
  .am .art{position:absolute;inset:0;transition:opacity .6s var(--ease)}
  .am .art.fade{opacity:0}
  .am .shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(18,24,22,.88) 0%,rgba(18,24,22,.55) 34%,rgba(18,24,22,0) 60%),linear-gradient(0deg,rgba(18,24,22,.6),rgba(18,24,22,0) 35%);pointer-events:none}
  .col{position:absolute;left:var(--gutter);top:calc(var(--chrome-top) + clamp(24px,5vh,56px));bottom:calc(var(--chrome-bottom) + clamp(20px,4vh,40px));width:min(420px,86vw);display:flex;flex-direction:column;gap:14px}
  .col h2{font-size:clamp(44px,5.5vw,84px);margin:.05em 0 0}
  .groups .tb-chip{color:var(--tb-paper)}
  .list{flex:1;overflow:auto;border-top:1px solid var(--tb-line-light);scrollbar-width:thin}
  .item{display:grid;grid-template-columns:34px 1fr;gap:12px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--tb-line-light);color:var(--tb-paper);padding:12px 0;opacity:.62;transition:opacity .2s}
  .item:hover{opacity:.9}
  .item[aria-current="true"]{opacity:1}
  .item .n{font-family:var(--f-data);font-size:12px;padding-top:3px}
  .item b{font-weight:500;font-size:16px;display:block}
  .item small{font-family:var(--f-data);font-size:10.5px;letter-spacing:.08em;opacity:.7}
  .item .d{display:none;font-size:14px;line-height:1.5;opacity:.85;margin-top:6px}
  .item[aria-current="true"] .d{display:block}
  .mini{position:absolute;right:var(--gutter);bottom:calc(var(--chrome-bottom) + clamp(20px,4vh,40px));width:min(360px,38vw);aspect-ratio:1.5;background:rgba(242,238,230,.9);border-radius:6px;color:var(--tb-ink);padding:6px}
  .mini svg{width:100%;height:100%}
  .mini .cap{position:absolute;left:12px;top:8px;font-family:var(--f-data);font-size:10px;letter-spacing:.1em;opacity:.6}
  .tag{position:absolute;right:var(--gutter);top:calc(var(--chrome-top) + clamp(24px,5vh,56px));font-family:var(--f-data);font-size:11px;letter-spacing:.1em;background:rgba(18,24,22,.55);padding:8px 12px;border-radius:999px;backdrop-filter:blur(6px)}
  @media (max-width:800px){.mini{display:none}.col{width:auto;right:var(--gutter)}}
</style>
</head>
<body>
<section class="am" data-tb-theme="dark" aria-label="Amenities">
  <div class="art" id="art"></div>
  <div class="shade"></div>
  <div class="tag" id="tag"></div>
  <div class="col">
    <div class="tb-eyebrow">07 · Life at Tranquil Bay</div>
    <h2 class="tb-display">Shared ground</h2>
    <div class="groups tb-chips" id="groups" role="group" aria-label="Filter amenities"></div>
    <div class="list" id="list"></div>
    <div class="tb-disclaimer" style="color:var(--tb-paper)">Illustrations are artistic impressions. Phase 2 amenities subject to approvals.</div>
  </div>
  <div class="mini"><span class="cap">WHERE IT IS</span><svg id="mini"></svg></div>
</section>
<script src="tranquil_bay_data.js"></script>
<script src="tb-core.js"></script>
<script>
(() => {
  const {data: D, el} = TBX; const $ = id => document.getElementById(id);
  const A = D.amenities.filter(a => !a.service && a.map);
  const plan = TBX.drawPlan($('mini'));
  const S = {group: 'All', cur: A[0].id};

  /* image chain: re-rendered illustration -> existing image -> pending panel */
  function art(a) {
    const box = el('div', {style: {position: 'absolute', inset: 0}});
    const tries = [a.illustration ? `Rerenders/TB_${a.illustration.replace('-', '')}_16x9.jpg` : null, a.existing_image].filter(Boolean);
    const img = el('img', {alt: a.name + ', illustration', style: {width: '100%', height: '100%', objectFit: 'cover'}});
    let i = 0; const next = () => { if (i < tries.length) img.src = TBX.asset(tries[i++]); else { box.innerHTML = ''; box.append(el('div', {class: 'tb-pending'}, el('span', {}, `${a.illustration || 'Image'} · illustration pending`))); } };
    img.onerror = next; next(); box.append(img); return box;
  }
  function select(id) {
    S.cur = id; const a = A.find(x => x.id === id);
    const artEl = $('art'); artEl.classList.add('fade');
    setTimeout(() => { artEl.innerHTML = ''; artEl.append(art(a)); artEl.classList.remove('fade'); }, 280);
    $('tag').textContent = `${a.group.toUpperCase()} · ${a.tier.toUpperCase()}`;
    $('list').querySelectorAll('.item').forEach(b => b.setAttribute('aria-current', b.dataset.id === id));
    Object.entries(plan.pins).forEach(([k, g]) => { const c = g.querySelector('circle'); const on = k === id;
      c.setAttribute('r', on ? 38 : 26); c.style.fill = on ? 'var(--tb-lamp)' : ''; });
    TBX.emit('amenity-hover', {id});
  }
  function renderList() {
    $('list').innerHTML = '';
    A.forEach((a, i) => { if (S.group !== 'All' && a.group !== S.group) return;
      $('list').append(el('button', {class: 'item', 'data-id': a.id, onclick: () => select(a.id)},
        el('span', {class: 'n'}, String(i + 1).padStart(2, '0')),
        el('span', {}, el('small', {}, a.group.toUpperCase() + (a.phase === 2 ? ' · PHASE 2' : '')), el('b', {}, a.name), el('span', {class: 'd'}, a.desc))));
    });
    select(S.group === 'All' || A.find(a => a.id === S.cur && a.group === S.group) ? S.cur : A.find(a => a.group === S.group).id);
  }
  ['All', ...new Set(A.map(a => a.group))].forEach(g => $('groups').append(el('button', {class: 'tb-chip', 'aria-pressed': g === 'All', onclick: e => {
    S.group = g; $('groups').querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b === e.currentTarget)); renderList(); }}, g)));
  Object.entries(plan.pins).forEach(([k, g]) => g.addEventListener('click', () => { S.group = 'All'; renderList(); select(k); }));
  renderList();
  TBX.on('amenity', d => select(d.id));
})();
</script>
</body>
</html>
