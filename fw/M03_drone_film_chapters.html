<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tranquil Bay · The land from above</title>
<link rel="stylesheet" href="tb-core.css">
<style>
  .film{position:relative;height:var(--tb-vh,100vh);min-height:560px;background:#0d1110;color:var(--tb-paper);overflow:hidden}
  .film video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .film .shade{position:absolute;inset:0;background:linear-gradient(0deg,rgba(10,13,12,.85) 0%,rgba(10,13,12,.1) 38%,rgba(10,13,12,0) 60%),linear-gradient(90deg,rgba(10,13,12,.55),rgba(10,13,12,0) 45%);pointer-events:none}
  .title{position:absolute;left:var(--gutter);top:calc(var(--chrome-top) + clamp(24px,6vh,64px));max-width:560px}
  .title h2{font-size:clamp(48px,7vw,104px);margin:.05em 0 .15em}
  .title p{opacity:.85;line-height:1.55;max-width:40ch;margin:0}
  .cap{position:absolute;left:var(--gutter);bottom:calc(var(--chrome-bottom) + 128px);max-width:520px;transition:opacity .4s}
  .cap b{font-family:var(--f-display);letter-spacing:.01em;font-weight:500;font-size:clamp(28px,3vw,42px);display:block}
  .cap span{opacity:.8}
  .bar{position:absolute;left:var(--gutter);right:var(--gutter);bottom:calc(var(--chrome-bottom) + 36px)}
  .track{position:relative;height:3px;background:rgba(242,238,230,.22);cursor:pointer}
  .track .fill{position:absolute;left:0;top:0;bottom:0;background:var(--tb-lamp);width:0}
  .ticks{position:relative;height:56px}
  .tick{position:absolute;top:10px;transform:translateX(-1px);background:none;border:0;color:var(--tb-paper);text-align:left;padding:0 0 0 8px;border-left:1px solid rgba(242,238,230,.35);font-size:12px;opacity:.55;max-width:160px}
  .tick small{display:block;font-family:var(--f-data);font-size:10px;letter-spacing:.1em}
  .tick.on{opacity:1;border-color:var(--tb-lamp)}
  .ctl{position:absolute;right:var(--gutter);top:calc(var(--chrome-top) + clamp(24px,6vh,64px));display:flex;gap:10px}
  .ctl button{width:44px;height:44px;border-radius:50%;border:1px solid rgba(242,238,230,.5);background:rgba(10,13,12,.3);color:var(--tb-paper);backdrop-filter:blur(6px)}
  .stills{position:absolute;inset:0;display:none;grid-template-columns:repeat(2,1fr);gap:4px;background:#0d1110}
  .stills.on{display:grid}
  .stills figure{margin:0;position:relative;overflow:hidden;cursor:zoom-in}
  .stills img{width:100%;height:100%;object-fit:cover;transition:transform 1.2s var(--ease)}
  .stills figure:hover img{transform:scale(1.04)}
  .lightbox{position:fixed;inset:0;background:#000;display:none;z-index:10;cursor:zoom-out}
  .lightbox.on{display:block}
  .lightbox img{width:100%;height:100%;object-fit:contain}
  @media (max-width:760px){.tick{font-size:0;padding:0}.tick small{font-size:9px}.cap{bottom:calc(var(--chrome-bottom) + 110px)}}
</style>
</head>
<body>
<section class="film" data-tb-theme="dark" aria-label="Drone film of the site">
  <video id="v" muted playsinline preload="metadata" loop></video>
  <div class="stills" id="stills"></div>
  <div class="shade"></div>
  <div class="title">
    <div class="tb-eyebrow">03 · The land</div>
    <h2 class="tb-display">From above</h2>
    <p>Filmed in August, at the height of the monsoon: the river reach, the groves around the site and the roads already cut for the villa lanes.</p>
  </div>
  <div class="ctl">
    <button id="play" aria-label="Play or pause">❚❚</button>
    <button id="snd" aria-label="Sound on or off">🔇</button>
    <button id="mode" aria-label="Switch between film and stills" title="Stills">▦</button>
  </div>
  <div class="cap" id="cap" aria-live="polite"><b></b><span></span></div>
  <div class="bar">
    <div class="track" id="track"><div class="fill" id="fill"></div></div>
    <div class="ticks" id="ticks"></div>
  </div>
  <div class="lightbox" id="lb"><img alt=""></div>
</section>
<script src="tranquil_bay_data.js"></script>
<script src="tb-core.js"></script>
<script>
(() => {
  const {data: D, el} = TBX; const F = D.drone;
  const v = document.getElementById('v'), dur = F.duration_s;
  v.src = TBX.asset(F.file);
  v.poster = TBX.asset(F.stills[1]);
  const ticks = document.getElementById('ticks');
  F.chapters.forEach((c, i) => ticks.append(el('button', {class: 'tick', style: {left: (c.t / dur * 100) + '%'}, onclick: () => { v.currentTime = c.t; v.play(); }},
    el('small', {}, String(i + 1).padStart(2, '0')), c.title)));
  const cap = document.getElementById('cap'); let curCh = -1;
  function chapterAt(t) { let k = 0; F.chapters.forEach((c, i) => { if (t >= c.t) k = i; }); return k; }
  v.addEventListener('timeupdate', () => {
    document.getElementById('fill').style.width = (v.currentTime / (v.duration || dur) * 100) + '%';
    const k = chapterAt(v.currentTime);
    if (k !== curCh) { curCh = k; cap.style.opacity = 0; setTimeout(() => { cap.querySelector('b').textContent = F.chapters[k].title; cap.querySelector('span').textContent = F.chapters[k].desc; cap.style.opacity = 1; }, 250);
      ticks.querySelectorAll('.tick').forEach((t, i) => t.classList.toggle('on', i === k)); }
  });
  document.getElementById('track').addEventListener('click', e => { const r = e.currentTarget.getBoundingClientRect(); v.currentTime = (e.clientX - r.left) / r.width * (v.duration || dur); });
  const play = document.getElementById('play');
  play.onclick = () => v.paused ? v.play() : v.pause();
  v.addEventListener('play', () => play.textContent = '❚❚'); v.addEventListener('pause', () => play.textContent = '▶');
  document.getElementById('snd').onclick = e => { v.muted = !v.muted; e.currentTarget.textContent = v.muted ? '🔇' : '🔊'; };
  // autoplay only when in view
  new IntersectionObserver(es => es.forEach(x => x.isIntersecting ? v.play().catch(() => {}) : v.pause()), {threshold: .5}).observe(v);
  // stills grid
  const stills = document.getElementById('stills'), lb = document.getElementById('lb');
  F.stills.forEach(s => stills.append(el('figure', {onclick: () => { lb.querySelector('img').src = TBX.asset(s); lb.classList.add('on'); }}, el('img', {src: TBX.asset(s), alt: 'Drone still of the site', loading: 'lazy'}))));
  lb.onclick = () => lb.classList.remove('on');
  document.getElementById('mode').onclick = e => { const on = stills.classList.toggle('on'); e.currentTarget.textContent = on ? '▶' : '▦'; on ? v.pause() : v.play(); cap.style.display = on ? 'none' : ''; };
  cap.querySelector('b').textContent = F.chapters[0].title; cap.querySelector('span').textContent = F.chapters[0].desc;
})();
</script>
</body>
</html>
